# Throwaway local infrastructure ONLY.
#
# Dev and prod use provided Postgres and MinIO; this file exists so a developer
# can run the stack without them. Redis is still deferred and still commented
# out - see docs/adr/0003, which docs/adr/0013 supersedes for MinIO only.
name: ha-todo-infra

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hatodo}
      POSTGRES_USER: ${POSTGRES_USER:-hatodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hatodo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hatodo} -d ${POSTGRES_DB:-hatodo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Profile pictures, and later the detail field's images (docs/adr/0013).
  # In dev and prod this is provided infrastructure on the LAN; here it is
  # throwaway, like the database beside it.
  minio:
    # chainguard/minio, not minio/minio: MinIO's own Docker Hub images now
    # refuse anonymous pulls, so the official name cannot be used by a
    # developer or by CI without credentials. This is the same MinIO server,
    # rebuilt. The cost is that the free tier publishes only :latest, which is
    # the one place this project tolerates an unpinned image - mirroring a
    # pinned tag into the project's own registry would restore it.
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Uncomment only alongside an ADR recording the concrete need.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     retries: 20

volumes:
  postgres-data:
  minio-data:

networks:
  default:
    name: ha-todo-net
