# Local development stack. Builds from source and depends on the infrastructure
# in docker-compose.infra.yml, which must be up first (scripts/dev-up.sh does
# both in order).
name: ha-todo-local

services:
  app:
    build:
      context: ../app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hatodo}
      DB_USERNAME: ${POSTGRES_USER:-hatodo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hatodo}
      # The throwaway object store beside the throwaway database. Its own
      # bucket, so nothing here can ever be confused with dev's or prod's.
      S3_ENDPOINT: http://objectstore:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-secret}
      S3_BUCKET: ${S3_BUCKET:-ha-todo-local}
      SESSION_COOKIE_SECURE: "false"
      # Local convenience credentials; dev and prod must supply their own.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Recurring items. The cron is hourly locally rather than nightly, so a
      # developer can watch the job work without waiting until 01:05 - and
      # catch-up is on, so a stack that has been down all week still produces
      # something to look at.
      RECURRENCE_ENABLED: ${RECURRENCE_ENABLED:-true}
      RECURRENCE_CRON: ${RECURRENCE_CRON:-0 5 * * * *}
      RECURRENCE_CATCH_UP_DAYS: ${RECURRENCE_CATCH_UP_DAYS:-7}
      # Without this, a rule's time of day would mean 7pm UTC in the container.
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Singapore}
    # Bound to loopback, not the LAN. The browser always talks to the web
    # service (same-origin /api); this port exists only so `pnpm dev` can proxy
    # to it and so you can curl the API directly while debugging.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  web:
    build:
      context: ../web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

networks:
  default:
    name: ha-todo-net
    external: true
