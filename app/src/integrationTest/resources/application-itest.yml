# These datasource values only satisfy property binding; the real connection
# comes from the Testcontainers @ServiceConnection bean, which takes precedence.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/overridden-by-testcontainers
    username: itest
    password: itest
  flyway:
    # Seed data included so the login flow has a known account to authenticate.
    locations: classpath:db/migration,classpath:db/seed

app:
  admin:
    # The initializer refuses to start without a password, so the integration
    # context has to supply one. It is also what the admin-API tests sign in with.
    username: admin
    display-name: Admin
    password: itest-admin-pw
