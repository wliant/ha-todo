# Throwaway local infrastructure ONLY.
#
# Dev and prod use provided Postgres and object storage; this file exists so a
# developer can run the stack without them. Redis is still deferred and still
# commented out - see docs/adr/0003, which docs/adr/0013 supersedes for object
# storage only.
name: ha-todo-infra

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hatodo}
      POSTGRES_USER: ${POSTGRES_USER:-hatodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hatodo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hatodo} -d ${POSTGRES_DB:-hatodo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Profile pictures, and later the detail field's images (docs/adr/0013).
  # SeaweedFS rather than MinIO: MinIO's own images now refuse anonymous pulls,
  # so neither a developer nor CI can get one without credentials
  # (docs/adr/0021). Its S3 API is what the application talks to, so the code
  # does not know the difference. In dev and prod this is provided
  # infrastructure on the LAN; here it is throwaway, like the database beside
  # it.
  objectstore:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data -master.volumeSizeLimitMB=1024
    restart: unless-stopped
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - objectstore-data:/data
    healthcheck:
      # The S3 API answering is the readiness that matters; the app refuses to
      # start without it. Addressed by the container's own IP rather than
      # localhost: SeaweedFS binds this port to the interface, not loopback,
      # so a localhost probe is refused however healthy the server is.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname -i):8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Uncomment only alongside an ADR recording the concrete need.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     retries: 20

volumes:
  postgres-data:
  objectstore-data:

networks:
  default:
    name: ha-todo-net
