# Dev environment: provided Postgres, seeded demo accounts for the e2e suite.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # The old versioned seed (V900) is gone, replaced by a repeatable one, so a
    # database that already applied it must not be failed for its absence.
    # Scoped to the profiles that carry db/seed - prod never applied it and
    # keeps strict validation.
    ignore-migration-patterns: "*:missing"
