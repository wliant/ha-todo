# Shared defaults. Every environment-specific value comes from the environment,
# so no hostnames or secrets live in this repo.
app:
  # The single admin account, reconciled on every startup. No password default:
  # startup fails rather than leaving a deployment nobody can administer.
  # See docs/adr/0006-admin-account-from-environment.md.
  admin:
    username: ${ADMIN_USERNAME:admin}
    display-name: ${ADMIN_DISPLAY_NAME:Admin}
    password: ${ADMIN_PASSWORD:}
  # Object storage for profile pictures and, later, the detail field's images.
  # The bucket is named per environment rather than derived from the profile,
  # so a profile misconfiguration cannot put prod's images in dev's bucket.
  # See docs/adr/0013.
  storage:
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:}
  # Recurring items (R42). One instance runs, so the job takes no lock and
  # elects no leader; a second instance would double-run every rule, which
  # ux_todo_item_occurrence turns into logged violations rather than duplicate
  # chores. See docs/adr/0025.
  recurrence:
    enabled: ${RECURRENCE_ENABLED:true}
    # 01:05 in the household's zone: past midnight so "today" has turned over,
    # off the hour so it never shares a minute with anything else.
    cron: ${RECURRENCE_CRON:0 5 1 * * *}
    # Zero: a chore that was due last Tuesday is not worth creating on Friday.
    catch-up-days: ${RECURRENCE_CATCH_UP_DAYS:0}
    # The zone a rule's time of day means, and the zone the cron is read in.
    # Unset, every container image is UTC and "the bins go out at 7pm" is wrong
    # by the offset.
    zone: ${APP_TIMEZONE:UTC}

spring:
  application:
    name: ha-todo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # nginx must allow at least this much too, or an upload is refused before
      # the application ever sees it - see web/nginx.conf.
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # The app always sits behind nginx, and in dev/prod behind a TLS terminator
  # too. Without this Spring sees plain HTTP and builds http:// URLs for an
  # https:// site.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.hatodo: ${LOG_LEVEL_APP:INFO}
