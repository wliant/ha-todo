# dev environment. Images are pulled from the registry - never built on the
# target host. Database, and any future Redis/MinIO, are provided
# infrastructure; this stack only runs the application.
name: ha-todo-dev

services:
  app:
    image: ${REGISTRY}/ha-todo-app:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    # No published ports: the browser reaches the API same-origin through the
    # web service's nginx at /api. Exposing 8080 here would create a second,
    # cross-origin way in that cookies and CSRF are not configured for.
    expose:
      - "8080"

  web:
    image: ${REGISTRY}/ha-todo-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
