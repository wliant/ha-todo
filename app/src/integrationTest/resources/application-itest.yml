# These datasource values only satisfy property binding; the real connection
# comes from the Testcontainers @ServiceConnection bean, which takes precedence.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/overridden-by-testcontainers
    username: itest
    password: itest
  flyway:
    # Seed data included so the login flow has a known account to authenticate.
    locations: classpath:db/migration,classpath:db/seed

app:
  # A fixed zone for the integration context, so a test asserting which day
  # something lands on does not depend on where the machine running it is.
  timezone: Asia/Singapore
  admin:
    # The initializer refuses to start without a password, so the integration
    # context has to supply one. It is also what the admin-API tests sign in with.
    username: admin
    display-name: Admin
    password: itest-admin-pw
  # The scheduler is off here. Left on, a Testcontainers run can fire the job
  # mid-assertion and a flake appears months later with no obvious cause. The
  # materialiser is driven directly wherever it is actually under test.
  recurrence:
    enabled: false
  # Off for the same reason, and for one more: the poll would fetch whatever
  # address a test just subscribed, mid-assertion. The sync service is driven
  # directly wherever it is actually under test.
  calendar:
    enabled: false
    # The fixture feed is served from this machine, which the guard refuses in
    # any deployment. See docs/adr/0035.
    allow-private-hosts: true
