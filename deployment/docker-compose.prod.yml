# prod environment. Images are pulled from the registry - never built on the
# target host. Database, and any future Redis/MinIO, are provided
# infrastructure; this stack only runs the application.
name: ha-todo-prod

services:
  app:
    image: ${REGISTRY}/ha-todo-app:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${APP_PORT:-8080}:8080"

  web:
    image: ${REGISTRY}/ha-todo-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
