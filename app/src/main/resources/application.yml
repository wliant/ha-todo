# Shared defaults. Every environment-specific value comes from the environment,
# so no hostnames or secrets live in this repo.
app:
  # The household's zone, and therefore the whole product's: one household has
  # one definition of Thursday. Read by the recurrence job and by every
  # date-to-day decision, and served to the SPA on /api/me so the browser never
  # uses the device's zone. See docs/adr/0036.
  timezone: ${APP_TIMEZONE:Asia/Singapore}
  # The single admin account, reconciled on every startup. No password default:
  # startup fails rather than leaving a deployment nobody can administer.
  # See docs/adr/0006-admin-account-from-environment.md.
  admin:
    username: ${ADMIN_USERNAME:admin}
    display-name: ${ADMIN_DISPLAY_NAME:Admin}
    password: ${ADMIN_PASSWORD:}
  # Object storage for profile pictures and, later, the detail field's images.
  # The bucket is named per environment rather than derived from the profile,
  # so a profile misconfiguration cannot put prod's images in dev's bucket.
  # See docs/adr/0013.
  storage:
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:}
  # Recurring items (R42). One instance runs, so the job takes no lock and
  # elects no leader; a second instance would double-run every rule, which
  # ux_todo_item_occurrence turns into logged violations rather than duplicate
  # chores. See docs/adr/0025.
  recurrence:
    enabled: ${RECURRENCE_ENABLED:true}
    # 01:05 in the household's zone: past midnight so "today" has turned over,
    # off the hour so it never shares a minute with anything else.
    cron: ${RECURRENCE_CRON:0 5 1 * * *}
    # Zero: a chore that was due last Tuesday is not worth creating on Friday.
    catch-up-days: ${RECURRENCE_CATCH_UP_DAYS:0}
  # Subscribed calendar feeds (requirements/0007). Read-only .ics, no OAuth:
  # see docs/adr/0034.
  calendar:
    enabled: ${CALENDAR_SYNC_ENABLED:true}
    # Every 20 minutes, offset off the hour so it never shares a minute with
    # anything else. Providers regenerate their published .ics on their own
    # schedule, so polling harder buys nothing.
    cron: ${CALENDAR_SYNC_CRON:0 7/20 * * * *}
    # Wide enough to cover the widest view My day can ask for: the month grid
    # reaches 36 days back on the 31st of a month that began on a Sunday.
    window-days-back: ${CALENDAR_WINDOW_BACK:45}
    window-days-forward: ${CALENDAR_WINDOW_FORWARD:90}
    # A feed quiet for longer than this is called out on My day (R71).
    stale-after: ${CALENDAR_STALE_AFTER:PT6H}
    # False everywhere but local and the integration tests, which serve fixture
    # feeds from localhost. A member-supplied URL fetched by this server is a
    # request-forgery primitive otherwise - see docs/adr/0035.
    allow-private-hosts: ${CALENDAR_ALLOW_PRIVATE_HOSTS:false}
  # New work reaching an open agenda (requirements/0021). One server-sent
  # stream per open agenda, routed by grant: see docs/adr/0054 and 0055.
  live:
    # Off, /api/live/stream is absent. The client cannot tell that 404 from any
    # other failure to connect, so it falls back to refreshing periodically
    # rather than breaking the landing page - see docs/adr/0056.
    enabled: ${LIVE_ENABLED:true}
    # Under nginx's 60s proxy_read_timeout default AND under the typical idle
    # timeout of a front door we cannot inspect. It is also the only thing that
    # notices a peer that vanished - a slept phone, a closed lid.
    heartbeat: ${LIVE_HEARTBEAT:PT20S}
    # A deliberate recycle. Nothing re-checks authorization on an emitter that
    # is already open, so this bounds how long a stream authenticated at
    # subscribe time can outlive its session. It must also stay under nginx's
    # proxy_read_timeout for this location, or nginx cuts first and the client
    # reconnects on nginx's clock instead of ours.
    stream-timeout: ${LIVE_STREAM_TIMEOUT:PT30M}
    # So a reconnect bug in one tab cannot accumulate emitters.
    max-streams-per-member: ${LIVE_MAX_STREAMS:5}

spring:
  application:
    name: ha-todo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # nginx must allow at least this much too, or an upload is refused before
      # the application ever sees it - see web/nginx.conf.
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # The app always sits behind nginx, and in dev/prod behind a TLS terminator
  # too. Without this Spring sees plain HTTP and builds http:// URLs for an
  # https:// site.
  forward-headers-strategy: framework
  servlet:
    session:
      # Thirty days of *inactivity*, reset by every request the SPA makes - so a
      # member who opens the app at all keeps their session. The old value was
      # the framework's 30 minutes, which on a phone meant picking your name
      # again most times you opened it. See docs/adr/0038.
      timeout: ${SESSION_TIMEOUT:30d}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        # Persistent rather than a session cookie: without this the browser
        # drops it whenever it decides its browsing session ended, and the
        # timeout above would be invisible. RollingSessionCookieFilter re-issues
        # it as the member keeps using the app, because Tomcat writes this
        # cookie once at session creation and never again.
        max-age: ${SESSION_COOKIE_MAX_AGE:30d}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.hatodo: ${LOG_LEVEL_APP:INFO}
