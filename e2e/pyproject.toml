[project]
name = "ha-todo-e2e"
version = "0.1.0"
description = "Standalone end-to-end suite for ha-todo. Talks to a deployed system over HTTP only."
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3",
    "pytest-playwright>=0.7",
    "pytest-base-url>=2.1",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: minimal checks that the environment is alive and sign-in works",
    "profile: a member's own settings - their password and their colour scheme",
    "shell: the signed-in navigation shell, including the phone-width drawer",
    "lists: creating, finding, sharing and pinning lists",
    "access: who can see a list - the rule two browser contexts exist to prove",
    "fields: what shape a list says its items take",
    "items: adding, completing and scoring items",
]
