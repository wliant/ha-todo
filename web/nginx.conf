# Preserve the scheme the *browser* used. $scheme is only ever "http" here,
# because TLS is terminated upstream; overwriting X-Forwarded-Proto with it
# would tell Spring the request was insecure on an https:// site.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed assets are immutable; index.html must never be cached or clients
    # keep booting a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The worker and the manifest decide how the installed app behaves, so a
    # cached copy outlives a deploy the same way a cached index.html would.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store";
    }

    # The live stream (requirements/0021): a chunked response that stays open
    # for half an hour, so every buffer between the app and the browser has to
    # be off. Exact match, so it wins over the /api/ prefix below regardless of
    # order; written above it so the two are read together.
    #
    # EVERY proxy_set_header here is REPEATED FROM /api/ ON PURPOSE. nginx
    # inherits proxy_set_header from the enclosing level only when the current
    # level sets NONE of its own - so the moment this block sets Connection "",
    # Host, X-Real-IP, X-Forwarded-For and X-Forwarded-Proto all stop being
    # sent. Losing X-Forwarded-Proto is a silent downgrade: Spring would see
    # plain http on an https site, which is exactly what the map at the top of
    # this file exists to prevent.
    location = /api/live/stream {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        # Not "upgrade" - this is not a WebSocket. Clearing it keeps a client's
        # Connection: close out of the upstream keepalive pool.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # The whole point. Buffering turns a push into a poll with worse
        # latency, and the symptom is a feature that works perfectly in
        # development and never once pushes in production.
        proxy_buffering off;
        proxy_cache off;
        # Must exceed LIVE_STREAM_TIMEOUT, or nginx cuts the stream first and
        # the client reconnects on nginx's clock instead of ours.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # A gzip buffer is a buffer.
        gzip off;
        # Put the header BACK on the way out. nginx *consumes* X-Accel-Buffering
        # from an upstream response and does not forward it - so the copy the
        # application sets reaches this server and stops here, and the HTTPS
        # front door in front of both environments would never see it. That
        # front door is configured outside this repository and is the one hop
        # we cannot test from here, so this line is what asks it not to buffer.
        # Verified by curl: without it the response carries no such header.
        add_header X-Accel-Buffering no always;
    }

    # Same-origin API so session cookies and CSRF work without CORS.
    location /api/ {
        proxy_pass http://app:8080;
        # Profile pictures are uploaded through here. nginx defaults to 1m and
        # would refuse them with its own HTML error page, which the SPA cannot
        # parse - so this has to stay at least as large as the application's
        # own multipart limit (spring.servlet.multipart.max-request-size).
        client_max_body_size 6m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location /actuator/health {
        proxy_pass http://app:8080/actuator/health;
    }

    # SPA fallback: client-side routes are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
